name: Feature request
description: Suggest an improvement to the studio
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Proposed solution
  - type: checkboxes
    id: rules
    attributes:
      label: House rules
      options:
        - label: I've read _studio/STYLE.md. This doesn't change a house rule, or I explain why it should.
